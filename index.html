<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 jailbreak &middot; mansoor0x</title>
<style>
  :root {
    --bg-deep: #050507;
    --bg-card: #0c0d12;
    --border-color: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(99, 102, 241, 0.3);
    --accent: #818cf8;
    --accent-glow: rgba(129, 140, 248, 0.2);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --text-dim: #4b5563;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--text-main);
    font: 14px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Ambient background glow */
  body::before {
    content: '';
    position: absolute;
    width: 300px;
    height: 300px;
    background: var(--accent-glow);
    filter: blur(100px);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  #container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: 20px;
    padding: 32px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    backdrop-filter: blur(20px);
    box-sizing: border-box;
  }

  #brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #brand::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border-color), transparent);
  }

  #wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #state {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-main);
    text-transform: lowercase;
  }

  #det {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: lowercase;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }

  #det b {
    color: var(--text-main);
    font-weight: 600;
  }

  #cache {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    min-height: 18px;
    text-transform: lowercase;
    transition: color 0.3s ease;
  }

  #cache.cacheok {
    color: var(--accent);
  }

  .ok { color: var(--text-main); }
  .bad { color: #f87171; text-decoration: underline; text-decoration-color: rgba(248, 113, 113, 0.4); }
  .warn { color: #fbbf24; }
</style>
</head>
<body>
<div id="container">
  <div id="brand">mansoor0x</div>
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t.toLowerCase(); stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t.toLowerCase(); cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a playstation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("unsupported firmware", "bad"); return; }

    var target = (bug === "lapse" ? "lapse.html" : "poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("update ready -- press x or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("cached (first run) -- press x or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("update ready -- press x or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("cache failed -- press x or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("cache obsolete -- press x or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
